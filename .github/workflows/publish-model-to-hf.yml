name: Publish model mirror to Hugging Face

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Confirm publishing the selected GitHub main or release/* branch to the Hugging Face model repository."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"
      target_revision:
        description: "Hugging Face destination branch. Use main for current baseline or candidate/v1.1 for a new version."
        required: true
        type: choice
        options:
          - "main"
          - "candidate/v1.1"
          - "candidate/v1.2"
          - "candidate/v1.3"
          - "candidate/v2.0"
        default: "main"

permissions:
  contents: read

concurrency:
  group: trimorious-model-huggingface-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm_publish == 'yes' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the GitHub mirror and hydrate Git LFS files
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Hugging Face upload dependencies
        run: python -m pip install --upgrade huggingface_hub

      - name: Pre-flight and publish reviewed model artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish_model_to_hf.py --revision "${{ inputs.target_revision }}"
